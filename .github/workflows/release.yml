name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # No registry-url: that option writes //registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}.
      # npm treats the line as configured auth and skips the OIDC trusted-publisher exchange,
      # then PUT fails 404. Publish uses id-token above; npmjs must trust this file (release.yml).
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Trusted publishing requires npm >= 11.5.1
      - run: npm install -g npm@latest

      - name: Verify tag matches package version
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          TAG_VERSION=${GITHUB_REF_NAME#v}
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "tag v$TAG_VERSION does not match package.json version $PKG_VERSION"
            exit 1
          fi

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run coverage
      - run: npm run check

      - run: npm publish --provenance --access public
